name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
      - improve-ci-pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - nunorgago/project-a
          - nunorgago/project-b
    steps:
      # 1️⃣ Checkout current repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Checkout Project A
      - name: Checkout project-a
        uses: actions/checkout@v4
        with:
          repository: nunorgago/project-a
          token: ${{ secrets.GH_DOCS_TOKEN }}
          path: _external/project-a

      # 3️⃣ Checkout Project B
      - name: Checkout project-b
        uses: actions/checkout@v4
        with:
          repository: nunorgago/project-b
          token: ${{ secrets.GH_DOCS_TOKEN }}
          path: _external/project-b

      # 4️⃣ Copy docs into this repo
      - name: Copy external docs
        run: |
          rm -rf docs/project-a docs/project-b
          mkdir -p docs

          cp -R _external/project-a/docs docs/project-a
          cp -R _external/project-b/docs docs/project-b

      # 5️⃣ Setup Node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'

      # 6️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 7️⃣ Build docs
      - name: Build Documentation
        run: npm run build

      # 8️⃣ Deploy
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_DOCS_TOKEN }}
          publish_dir: ./build