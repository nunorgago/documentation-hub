name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
      - improve-ci-pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout current repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Checkout external projects and copy docs
      - name: Checkout external projects
        run: |
          mkdir -p _external docs

          cat projects.json | jq -c '.[]' | while read project; do
            name=$(echo "$project" | jq -r '.name')
            repo=$(echo "$project" | jq -r '.repo')

            echo "➡️ Processing $name ($repo)"

            # Clone project
            git clone https://x-access-token:${{ secrets.GH_DOCS_TOKEN }}@github.com/$repo.git _external/$name

            # Copy docs into hub
            rm -rf docs/$name
            cp -R _external/$name/docs docs/$name
          done

      # 3️⃣ Setup Node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5️⃣ Build docs
      - name: Build Documentation
        run: npm run build

      # 6️⃣ Deploy
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_DOCS_TOKEN }}
          publish_dir: ./build